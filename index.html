<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ExpensesWallet</title>
  <meta name="theme-color" content="#16a34a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Wallet" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <header class="card balance">
      <div>
        <p class="label">Balance <span id="monthLabel"></span></p>
        <h1 id="balance">0</h1>
      </div>
      <div class="row">
        <div class="pill in"><span>In</span><strong id="totalIn">0</strong></div>
        <div class="pill out"><span>Out</span><strong id="totalOut">0</strong></div>
      </div>
      <div class="month-nav">
        <button id="prevMonth" aria-label="Previous month">‹</button>
        <span id="currentMonth"></span>
        <button id="nextMonth" aria-label="Next month">›</button>
      </div>
    </header>

    <section class="card">
      <div class="type-toggle" role="tablist">
        <button id="typeExpense" class="active" type="button">Expense</button>
        <button id="typeIncome" type="button">Income</button>
      </div>
      <form id="txForm">
        <label>Amount
          <input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0" required />
        </label>
        <div class="grid2">
          <label>Category
            <select id="category"></select>
          </label>
          <label>Date
            <input id="date" type="date" required />
          </label>
        </div>
        <label>Note
          <input id="note" type="text" placeholder="e.g. groceries" maxlength="80" />
        </label>
        <button class="primary" type="submit">Add</button>
      </form>
    </section>

    <section class="card">
      <div class="list-head">
        <h2>History</h2>
        <div>
          <button id="exportBtn" type="button">Export</button>
          <button id="wipeBtn" type="button" class="danger">Clear</button>
        </div>
      </div>
      <ul id="list"></ul>
      <p id="empty" class="muted">No entries yet. Add your first one above.</p>
    </section>

    <p class="hint">On iPhone: Share → Add to Home Screen to use like an app. Works offline.</p>
  </main>

  <script src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
